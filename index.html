<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中 | Coming Soon</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 主体容器 - 渐变背景 + 水波纹动画容器 */
        body {
            min-height: 100vh;
            /* 蓝紫渐变背景 */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 水波纹动画效果 */
        .water-wave {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40%;
            /* 水波纹动画 */
            animation: wave-animation 15s infinite linear;
            z-index: 0;
        }

        /* 第二个水波纹 - 延迟动画增加层次感 */
        .water-wave:nth-child(2) {
            animation: wave-animation 20s infinite linear;
            background: rgba(255, 255, 255, 0.05);
        }

        /* 水波纹动画关键帧 */
        @keyframes wave-animation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 内容卡片 */
        .content-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 4rem 6rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        /* 标题样式 */
        .content-card h1 {
            font-size: 3.5rem;
            color: #333;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        /* 副标题样式 */
        .content-card p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* 图标样式 */
        .content-card .icon {
            font-size: 5rem;
            color: #667eea;
            margin-bottom: 2rem;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .content-card {
                padding: 2rem 3rem;
            }
            .content-card h1 {
                font-size: 2.5rem;
            }
            .content-card .icon {
                font-size: 4rem;
            }
        }
    </style>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 水波纹动画元素 -->
    <div class="water-wave"></div>
    <div class="water-wave"></div>

    <!-- 核心内容 -->
    <div class="content-card">
        <div class="icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1>网站建设中</h1>
        <p>我们正在努力打造更好的体验，敬请期待！<br>We are working hard to create a better experience, coming soon!</p>
    </div>
</body>
</html>
